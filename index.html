<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALOOGAME HOST</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#080808;color:white;
font-family:Arial,sans-serif;text-align:center
}
header{
padding:40px 15px;
background:linear-gradient(135deg,#500000,#090909);
border-bottom:3px solid red
}
.logo{
font-size:42px;font-weight:bold;
color:#ff2929;text-shadow:0 0 20px red
}
h2{color:#ff3030}
.card{
max-width:500px;margin:20px auto;padding:22px;
background:#181818;border:1px solid #a22;
border-radius:14px
}
select{
width:100%;padding:14px;
background:#222;color:white;
border:1px solid red;border-radius:8px;
font-size:16px
}
button{
padding:12px 24px;background:#c00;
color:white;border:0;border-radius:8px;
font-size:16px
}
footer{padding:30px;color:#777}
</style>
</head>
<body>
<header>
<div class="logo">ALOOGAME</div>
<h2>PS4 HOST</h2>
<p>WELCOME TO OUR GAMING WORLD</p>
</header>
<main>
<div class="card">
<h2>FIRMWARE SELECTOR</h2>
<p>نسخه فریمور خود را انتخاب کنید:</p>
<select id="firmware">
<option value="">انتخاب فریمور</option>
</select>
<p id="result">منتظر انتخاب نسخه...</p>
</div>
<div class="card">
<h2>ABOUT ALOOGAME</h2>
<p>به هاست اختصاصی ALOOGAME خوش آمدید.</p>
<p>اطلاعات سازگاری فریمورها به‌زودی تکمیل می‌شود.</p>
</div>
</main>
<footer>© 2026 ALOOGAME HOST</footer>
<script>
const select=document.getElementById("firmware");
for(let i=1;i<=14;i++){
for(let j=0;j<=99;j++){
if(i===14&&j>0)break;
let v=i+"."+String(j).padStart(2,"0");
let option=document.createElement("option");
option.value=v;
option.textContent="Firmware "+v;
select.appendChild(option);
}}
select.addEventListener("change",()=>{
document.getElementById("result").textContent=
select.value?
"اطلاعات سازگاری "+select.value+" هنوز تأیید نشده است.":
"منتظر انتخاب نسخه...";
});
</script>
</body>
</html>
